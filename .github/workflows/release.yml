name: Publish npm package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version from package.json to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: node scripts/assert-release.mjs
        env:
          RELEASE_VERSION: ${{ inputs.version || '' }}
      - run: npm publish --provenance
